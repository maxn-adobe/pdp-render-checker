name: PDP Render Check

on:
  # 1. Manual run from the Actions tab (this is your "dashboard").
  workflow_dispatch:
    inputs:
      url:
        description: "Full .aem.live / .aem.page URL to check"
        required: true
        type: string
      expected_title:
        description: "Expected H1 / product title (optional; enables exact-match)"
        required: false
        type: string
      expected_hero:
        description: "Expected hero image URL substring (optional)"
        required: false
        type: string
  # 2. API trigger (repository_dispatch) so the DA tool can call it.
  #    Send client_payload.targets = JSON array of { url, expected }.
  repository_dispatch:
    types: [pdp-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run PDP render check
        env:
          # Single-target inputs (manual run)
          CHECK_URL: ${{ github.event.inputs.url }}
          EXPECTED_TITLE: ${{ github.event.inputs.expected_title }}
          EXPECTED_HERO: ${{ github.event.inputs.expected_hero }}
          # Batch target (API run): client_payload.targets -> JSON array
          CHECK_TARGETS: ${{ toJSON(github.event.client_payload.targets) }}
        run: npm run check
