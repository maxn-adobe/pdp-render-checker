name: PDP Render Check

on:
  # 1. Manual run from the Actions tab (this is your "dashboard").
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs (one per line or comma-separated). For a handful of ad hoc URLs only — blank = use urls_file/urls.txt. For big pastes, use the CLI instead (see README)."
        required: false
        type: string
      urls_file:
        description: "Committed URL list to use (e.g. urls_2.txt; lists live in sample-data/, a bare filename is fine). Ignored if 'urls' above is filled in. Blank = urls.txt."
        required: false
        type: string
      concurrency:
        description: "Advanced: override page concurrency (default 3)."
        required: false
        type: string
  # 2. API trigger (repository_dispatch) so the DA tool can call it.
  #    Send client_payload.urls = JSON array of URL strings.
  repository_dispatch:
    types: [pdp-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run PDP render check
        env:
          # Manual run: newline- or comma-separated string
          CHECK_URLS: ${{ github.event.inputs.urls }}
          # API run: client_payload.urls -> JSON array of strings
          CHECK_URLS_JSON: ${{ toJSON(github.event.client_payload.urls) }}
          URLS_FILE: ${{ github.event.inputs.urls_file }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
        run: npm run check
